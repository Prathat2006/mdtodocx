<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="16" fill="#1C3832"/>
  
  <!-- 'M' in Off-White -->
  <text 
    x="22" 
    y="40" 
    font-size="24" 
    font-weight="700" 
    font-family="Inter, -apple-system, sans-serif" 
    fill="#F4EFEB" 
    text-anchor="middle">M</text>
    
  <!-- Stylized Right Arrow in Coral Accent -->
  <path 
    d="M30 33h6m0 0l-2.5-2.5M36 33l-2.5 2.5" 
    stroke="#E2725B" 
