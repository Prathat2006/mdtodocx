[project]
name = "mdtodocx"
version = "1.0.5"
description = "A Markdown editor that exports documents to DOCX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pypandoc>=1.17",
    "python-multipart>=0.0.9",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false
